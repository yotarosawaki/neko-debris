<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NEKO DEBRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#04050a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ============================================================
//  NEKO DEBRIS  — 猫デブリ
//  縦スクロール弾幕シューティング（スマホ操作）
// ============================================================
const W = 360, H = 640, TAU = Math.PI * 2;
const F = "Orbitron,'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SC = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SC = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * SC) + 'px'; cv.style.height = (H * SC) + 'px';
  cv.width = Math.round(W * SC * DPR); cv.height = Math.round(H * SC * DPR);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- utils ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function rm(arr, i) { arr[i] = arr[arr.length - 1]; arr.pop(); }
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
const fmt = n => String(Math.floor(n)).padStart(9, '0');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
let hi = store.get('nd_hi', 0), unlocked = store.get('nd_unlock', 0);
if (/[?&]unlock/.test(location.search)) unlocked = 4;

// ---------- stages ----------
const STAGES = [
  { boss: 'neptune', name: 'NEPTUNE', sub: 'OUTER RIM',     col: '#4cc9ff', bg: ['#071a3a', '#02040b'] },
  { boss: 'saturn',  name: 'SATURN',  sub: 'RING BELT',     col: '#ffd27a', bg: ['#231805', '#050402'] },
  { boss: 'jupiter', name: 'JUPITER', sub: 'STORM GIANT',   col: '#ff9a5c', bg: ['#2a1209', '#060302'] },
  { boss: 'mars',    name: 'MARS',    sub: 'RED FRONTIER',  col: '#ff5a4a', bg: ['#2c0909', '#060203'] },
  { boss: 'sun',     name: 'SOL',     sub: 'THE CORE',      col: '#ffc53a', bg: ['#3d1604', '#0a0402'] },
];
const acc = () => STAGES[G ? G.stage : 0].col;

// ============================================================
//  AUDIO（WebAudioで全部合成）
// ============================================================
const AU = { c: null, m: null, sfx: null, mus: null, nb: null, on: store.get('nd_snd', true) };
function audioInit() {
  if (AU.c) { if (AU.c.state === 'suspended' && mode !== 'pause') AU.c.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; const c = new C(); AU.c = c;
    AU.m = c.createGain(); AU.m.gain.value = AU.on ? .6 : 0; AU.m.connect(c.destination);
    AU.sfx = c.createGain(); AU.sfx.gain.value = .55; AU.sfx.connect(AU.m);
    AU.mus = c.createGain(); AU.mus.gain.value = .3; AU.mus.connect(AU.m);
    const n = c.createBuffer(1, c.sampleRate, c.sampleRate), d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    AU.nb = n; SEQ.next = c.currentTime + .1;
    if (mode === 'title' || mode === 'ending') playTitle();
  } catch (e) { AU.c = null; }
}
function env(g, t, v, a, d) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
function tone(f, d, type, v, f2, dest, t) {
  if (!AU.c) return; t = t || AU.c.currentTime;
  const o = AU.c.createOscillator(), g = AU.c.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  env(g, t, v, .005, d); o.connect(g); g.connect(dest || AU.sfx); o.start(t); o.stop(t + d + .05);
}
function noise(d, v, f, type, f2, dest, t) {
  if (!AU.c) return; t = t || AU.c.currentTime;
  const s = AU.c.createBufferSource(); s.buffer = AU.nb;
  const fl = AU.c.createBiquadFilter(); fl.type = type || 'lowpass'; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  const g = AU.c.createGain(); env(g, t, v, .005, d);
  s.connect(fl); fl.connect(g); g.connect(dest || AU.sfx); s.start(t, Math.random() * .5); s.stop(t + d + .05);
}
const sfxT = {};
function can(k, ms) { const n = performance.now(); if (sfxT[k] && n - sfxT[k] < ms) return false; sfxT[k] = n; return true; }
const at = s => AU.c ? AU.c.currentTime + s : 0;
const SFX = {
  shot() { if (can('shot', 80)) tone(1500, .03, 'square', .02, 800); },
  boom(s) { if (can('boom', 45)) noise(.15 + s * .1, .22 + s * .07, 1800, 'lowpass', 80); },
  graze() { if (can('graze', 45)) tone(2600, .03, 'sine', .05); },
  item() { if (can('item', 50)) tone(1400, .05, 'triangle', .06, 2100); },
  power() { [880, 1175, 1760].forEach((f, i) => tone(f, .09, 'triangle', .09, 0, null, at(i * .06))); },
  die() { noise(.9, .5, 3000, 'lowpass', 60); tone(700, .7, 'sawtooth', .14, 50); },
  bomb() { noise(1.4, .5, 200, 'lowpass', 5000); tone(95, 1.3, 'sine', .45, 30); },
  warn() { for (let i = 0; i < 4; i++) { tone(620, .22, 'sawtooth', .07, 0, null, at(i * .5)); tone(440, .22, 'sawtooth', .07, 0, null, at(i * .5 + .25)); } },
  phase() { noise(.6, .35, 4000, 'lowpass', 100); tone(220, .5, 'triangle', .2, 60); },
  bigboom() { noise(2.2, .6, 2500, 'lowpass', 40); tone(120, 1.8, 'sine', .5, 25); },
  select() { tone(1000, .06, 'square', .05, 1600); },
};

// BGM シーケンサ
const SONGS = [
  { root: 0,  tempo: 126, prog: [[0, 0], [8, 1], [10, 1], [7, 0]] },
  { root: 3,  tempo: 130, prog: [[0, 0], [5, 0], [8, 1], [10, 1]] },
  { root: -2, tempo: 134, prog: [[0, 0], [10, 1], [8, 1], [10, 1]] },
  { root: 1,  tempo: 138, prog: [[0, 0], [0, 0], [8, 1], [7, 1]] },
  { root: 5,  tempo: 142, prog: [[0, 0], [8, 1], [3, 1], [10, 1]] },
];
const TITLE_SONG = { root: 0, tempo: 96, prog: [[0, 0], [8, 1], [3, 1], [10, 1]] };
const SEQ = { on: false, step: 0, next: 0, song: SONGS[0], boss: false, title: false };
function playBGM(i, boss) { SEQ.song = SONGS[i]; SEQ.boss = boss; SEQ.title = false; SEQ.on = true; SEQ.step = 0; if (AU.c) SEQ.next = AU.c.currentTime + .08; }
function playTitle() { SEQ.song = TITLE_SONG; SEQ.boss = false; SEQ.title = true; SEQ.on = true; SEQ.step = 0; if (AU.c) SEQ.next = AU.c.currentTime + .08; }
function stopBGM() { SEQ.on = false; }
setInterval(() => {
  if (!AU.c || !SEQ.on || AU.c.state !== 'running') return;
  const c = AU.c; if (SEQ.next < c.currentTime - .2) SEQ.next = c.currentTime + .05;
  const sd = 60 / (SEQ.song.tempo + (SEQ.boss ? 16 : 0)) / 4;
  while (SEQ.next < c.currentTime + .15) { stepBGM(SEQ.step, SEQ.next, sd); SEQ.next += sd; SEQ.step++; }
}, 25);
function stepBGM(i, t, sd) {
  const S = SEQ.song, s = i % 16, bar = (i >> 4) % 4, [ch, q] = S.prog[bar];
  const base = 55 * Math.pow(2, (S.root + ch) / 12), tri = q ? [0, 4, 7] : [0, 3, 7], M = AU.mus;
  const nf = (b, iv) => b * Math.pow(2, iv / 12);
  if (SEQ.title) {
    if (s % 2 === 0) tone(nf(base * 4, [0, 7, 12, 7, 3, 7, 12, 19][(s / 2) % 8] + (q && [3, 15].includes([0, 7, 12, 7, 3, 7, 12, 19][(s / 2) % 8]) ? 1 : 0)), sd * 3, 'triangle', .05, 0, M, t);
    if (s === 0) tone(base * 2, sd * 15, 'triangle', .12, 0, M, t);
    return;
  }
  if (s % 4 === 0) tone(150, .14, 'sine', .55, 40, M, t);
  if (s % 2 === 1) noise(.03, .07, 7000, 'highpass', 0, M, t);
  if (SEQ.boss && (s === 4 || s === 12)) noise(.12, .16, 1800, 'bandpass', 0, M, t);
  if (s % 2 === 0) tone(base * (s % 4 === 2 ? 4 : 2), sd * 1.6, 'triangle', .22, 0, M, t);
  const ar = [0, 1, 2, 3, 2, 1, 2, 3][s % 8], iv = ar === 3 ? 12 : tri[ar];
  tone(nf(base * 4, iv), sd * .9, 'square', .03, 0, M, t);
  if (SEQ.boss && s % 4 === 0) tone(nf(base * 8, tri[(s / 4 + bar) % 3]), sd * 3, 'sawtooth', .025, 0, M, t);
}

// ============================================================
//  GAME STATE
// ============================================================
let mode = 'title', G = null, S = null, P = null, boss = null;
let shots = [], ebs = [], ens = [], parts = [], items = [], sched = [], texts = [];
let shake = 0, flash = 0, frame = 0, scroll = 1, bombT = 0, overT = 0, endT = 0;
let uiBtns = [];
const keys = {};

function newGame(st) {
  G = { score: 0, lives: 2, bombs: 3, power: 1, graze: 0, cont: 0, stage: st };
  P = { x: W / 2, y: H - 110, r: 2.4, alive: true, inv: 120, rs: 0, vx: 0, ox: [W / 2 - 22, W / 2 + 22], oy: [H - 100, H - 100], shotT: 0, enter: 0 };
  startStage(st); mode = 'game'; resetTouch();
}
function startStage(i) {
  G.stage = i;
  S = { t: 0, phase: 'waves', wi: 0, waves: buildWaves(i), pt: 0, graze0: G.graze, bonus: null };
  shots = []; ebs = []; ens = []; items = []; sched = []; boss = null;
  playBGM(i, false);
}
function toTitle() { saveHi(); mode = 'title'; boss = null; ebs = []; ens = []; shots = []; items = []; parts = []; G = null; playTitle(); }
function saveHi() { if (G && G.score > hi) { hi = G.score; store.set('nd_hi', hi); } }
function later(d, fn) { sched.push({ t: S.t + d, fn }); }
function aim(x, y) { return P && P.alive ? Math.atan2(P.y - y, P.x - x) : Math.PI / 2; }
function float(x, y, s, col) { texts.push({ x, y, s, col: col || '#fff', t: 60 }); }

// ---------- enemy bullets ----------
function eb(x, y, a, sp, o) { return ebv(x, y, Math.cos(a) * sp, Math.sin(a) * sp, o); }
function ebv(x, y, vx, vy, o) {
  o = o || {}; if (ebs.length > 900) return null;
  const b = { x, y, vx, vy, r: o.r || 3.5, k: o.k || 0, col: o.col || acc(), w: o.w || 0, ax: o.ax || 0, ay: o.ay || 0, fr: o.fr || 0, aim: o.aim || 0, sp2: o.sp2 || 3, g: false, t: 0 };
  ebs.push(b); return b;
}
function ring(x, y, n, sp, off, o) { for (let i = 0; i < n; i++) eb(x, y, off + i * TAU / n, sp, o); }
function fan(x, y, n, spread, sp, a, o) { if (n === 1) { eb(x, y, a, sp, o); return; } for (let i = 0; i < n; i++) eb(x, y, a - spread / 2 + spread * i / (n - 1), sp, o); }
function cancelBullets() { for (const b of ebs) { if (parts.length < 500) parts.push({ x: b.x, y: b.y, vx: 0, vy: -1, l: 20, m: 20, c: b.col, k: 2 }); G.score += 10; } ebs.length = 0; }

// ---------- particles ----------
function spark(x, y, n, col, sp, life) { for (let i = 0; i < n; i++) { if (parts.length > 500) break; const a = rnd(0, TAU), s = rnd(.3, 1) * sp; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: life * rnd(.5, 1), m: life, c: col, k: 0 }); } }
function shock(x, y, r, col, life) { parts.push({ x, y, r1: r, l: life, m: life, c: col, k: 1 }); }
function explode(x, y, size, col) {
  spark(x, y, 6 + size * 5, col, 2 + size * 1.4, 24 + size * 6);
  spark(x, y, 3 + size * 2, '#ffffff', 1.5 + size, 16);
  shock(x, y, 12 + size * 16, col, 18 + size * 4);
  if (size >= 2) shake = Math.max(shake, size * 1.6);
}

// ============================================================
//  ENEMIES（デブリ）
// ============================================================
function rockPts(r) { const n = 7 + (Math.random() * 4 | 0), p = []; for (let i = 0; i < n; i++) { const a = i * TAU / n + rnd(-.2, .2), d = r * rnd(.72, 1.1); p.push(Math.cos(a) * d, Math.sin(a) * d); } return p; }
function enemy(o) {
  const e = Object.assign({ x: 0, y: -20, vx: 0, vy: 1, hp: 3, r: 10, t: 0, rot: rnd(0, TAU), vr: rnd(-.05, .05), type: 'rock', score: 100, hitF: 0, drop: .22, dropN: 0 }, o);
  if (e.type === 'rock' || e.type === 'big' || e.type === 'chip') e.pts = rockPts(e.r);
  if (e.type === 'big') e.pts2 = rockPts(e.r * .5);
  ens.push(e); return e;
}
const canFire = e => P.alive && e.y > 0 && e.y < H * .62;
function W_rain(n, shoot) {
  const s = G.stage;
  for (let i = 0; i < n; i++) later(i * 12, () => enemy({
    type: 'rock', x: rnd(20, W - 20), vx: rnd(-.5, .5), vy: rnd(1.5, 2.3) + s * .12, r: rnd(7, 11), hp: 3,
    ai: e => { e.x += e.vx; e.y += e.vy; if (shoot && e.t === 50 && Math.random() < .25 + s * .1 && canFire(e)) eb(e.x, e.y, aim(e.x, e.y), 2.3 + s * .2, { r: 3.5 }); }
  }));
}
function W_snake(side, n) {
  const s = G.stage, x0 = side < 0 ? W * .3 : W * .7;
  for (let i = 0; i < n; i++) later(i * 9, () => enemy({
    type: 'panel', x: x0, x0, hp: 5, r: 9, score: 150,
    ai: e => { e.y += 1.9 + s * .1; e.x = e.x0 + Math.sin(e.t * .045) * W * .22 * side; if (s >= 1 && e.t % 80 === 40 && canFire(e)) eb(e.x, e.y, aim(e.x, e.y), 2.4, { r: 3.5 }); }
  }));
}
function W_side(side, n) {
  const s = G.stage;
  for (let i = 0; i < n; i++) later(i * 14, () => enemy({
    type: 'panel', x: side < 0 ? -20 : W + 20, y: rnd(50, 170), vx: side * (2.2 + s * .15), vy: .35, hp: 5, r: 9, score: 150,
    ai: e => { e.x += e.vx; e.y += e.vy; if (e.t === 45 && canFire(e)) fan(e.x, e.y, s >= 2 ? 3 : 1, .35, 2.5 + s * .15, aim(e.x, e.y), { r: 3.5 }); }
  }));
}
function W_sat(x) {
  const s = G.stage;
  enemy({
    type: 'sat', x, y: -24, hp: 14 + s * 3, r: 13, score: 500, dropN: 2, ty: rnd(90, 160), vr: 0, rot: 0,
    ai: e => {
      if (e.t < 60) e.y += (e.ty - e.y) * .06;
      else if (e.t < 220) { if ((e.t - 60) % 45 === 0 && canFire(e)) fan(e.x, e.y, 3 + s, .22 * (3 + s), 2.2 + s * .15, aim(e.x, e.y), { r: 4 }); }
      else e.y -= 1.4;
      e.rot = Math.sin(e.t * .03) * .25;
    }
  });
}
function W_big(x) {
  const s = G.stage;
  enemy({
    type: 'big', x, y: -40, vy: .55, hp: 45 + s * 12, r: 26, score: 2000, vr: rnd(-.012, .012), dropN: 3,
    ai: e => { e.y += e.vy; if (e.t % (80 - s * 6) === 40 && canFire(e)) ring(e.x, e.y, 10 + s * 2, 1.6 + s * .12, rnd(0, TAU), { r: 4 }); },
    onDie: e => { for (let k = 0; k < 4; k++) { const a = rnd(0, TAU); enemy({ type: 'chip', x: e.x, y: e.y, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 + .5, r: 6, hp: 2, score: 50, drop: 0, vr: rnd(-.1, .1) }); } }
  });
}
function W_v(n) {
  const s = G.stage;
  for (let i = 0; i < n; i++) {
    const k = i - (n - 1) / 2;
    enemy({ type: 'rock', x: W / 2 + k * 32, y: -20 - Math.abs(k) * 24, vy: 1.7, hp: 4, r: 9, score: 120,
      ai: e => { e.y += e.vy; if (e.t === 70 && canFire(e)) eb(e.x, e.y, aim(e.x, e.y), 2.6 + s * .2, { k: 1 }); } });
  }
}
function buildWaves(s) {
  const L = []; let t = 150; const A = (gap, fn) => { L.push({ t, fn }); t += gap; };
  A(170, () => W_rain(6 + s, false));
  A(150, () => W_snake(-1, 6));
  A(170, () => W_snake(1, 6));
  A(60, () => W_sat(W * .3));
  A(190, () => W_sat(W * .7));
  A(180, () => W_rain(10 + s * 2, true));
  A(230, () => W_big(W / 2));
  A(140, () => W_side(-1, 5));
  A(170, () => W_side(1, 5));
  A(180, () => W_v(7));
  A(150, () => { W_rain(8 + s * 2, true); if (s >= 2) W_sat(W / 2); });
  A(240, () => { W_big(W * .28); W_big(W * .72); });
  A(200, () => { W_snake(-1, 7); W_snake(1, 7); });
  A(170, () => { W_sat(W * .2); W_sat(W * .5); W_sat(W * .8); });
  A(200, () => W_rain(14 + s * 3, true));
  return { list: L, end: t };
}
function damage(e, d) {
  if (e.dead) return; e.hp -= d; e.hitF = 3;
  if (e.hp <= 0) {
    e.dead = true; const sz = e.type === 'big' ? 3 : e.type === 'sat' ? 2 : 1;
    explode(e.x, e.y, sz, e.type === 'rock' || e.type === 'chip' ? '#c9d3e6' : acc()); SFX.boom(sz);
    G.score += e.score;
    const n = e.dropN || (Math.random() < e.drop ? 1 : 0);
    for (let k = 0; k < n; k++) item(e.x + rnd(-10, 10), e.y + rnd(-10, 10), 'p');
    if (e.type === 'big') item(e.x, e.y, 's');
    if (e.onDie) e.onDie(e);
  }
}

// ============================================================
//  BOSSES（太陽系）
// ============================================================
const BOSSES = {
  neptune: { id: 'neptune', name: 'NEPTUNE', r: 44, col: '#4cc9ff', c2: '#b8f3ff', phases: [
    { name: 'TIDAL SPIRAL', hp: 450, fn(b, t) {
      if (t % 5 === 0) { for (let k = 0; k < 2; k++) eb(b.x, b.y, b.a + k * Math.PI, 1.9, { r: 4, col: b.col }); b.a += .2; }
      if (t % 80 === 40) fan(b.x, b.y, 5, .7, 3, aim(b.x, b.y), { k: 1 });
      if (t % 240 === 0) b.tx = rnd(90, W - 90);
    } },
    { name: 'TRITON WALTZ', hp: 600, init(b) { b.moons = [{ a: 0, d: 90, s: .024, r: 8, col: '#dfe8f0' }]; }, fn(b, t) {
      const m = b.moons[0];
      if (t % 45 === 0) ring(m.x, m.y, 12, 1.7, rnd(0, TAU), { r: 3, col: b.c2 });
      if (t % 70 === 0) { b.dir = -b.dir; ring(b.x, b.y, 18, 1.5, rnd(0, TAU), { r: 4, col: b.col, w: .007 * b.dir }); }
      if (t % 100 === 50) fan(b.x, b.y, 3, .4, 3.3, aim(b.x, b.y), { k: 1 });
      if (t % 200 === 0) b.tx = rnd(90, W - 90);
    } },
  ] },
  saturn: { id: 'saturn', name: 'SATURN', r: 40, ty: 130, col: '#ffd27a', c2: '#fff1c4', phases: [
    { name: 'RING CASCADE', hp: 550, fn(b, t) {
      if (t % 42 === 0) { const n = 26, o = rnd(0, TAU); for (let i = 0; i < n; i++) { const a = o + i * TAU / n; ebv(b.x, b.y, Math.cos(a) * 2.1, Math.sin(a) * .75 + 1.05, { r: 3.5, col: b.col }); } }
      if (t % 60 === 30) fan(b.x, b.y, 3, .3, 3.2, aim(b.x, b.y), { k: 1 });
      if (t % 220 === 0) b.tx = rnd(100, W - 100);
    } },

    const left = b.d.phases.length - 1 - b.pi;
    for (let i = 0; i < left; i++) { ctx.fillStyle = b.col; ctx.fillRect(x1 - 5 - i * 9, y + 9, 5, 5); }
    txt(b.d.phases[b.pi].name, x1, y + 28, 7, hexA(b.col, .9), 'right', 400, 1.5);
    // bottom marker
    ctx.fillStyle = hexA(b.col, .8); ctx.beginPath(); ctx.moveTo(b.x, H - 8); ctx.lineTo(b.x - 6, H); ctx.lineTo(b.x + 6, H); ctx.fill();
  }
  // power / graze
  const lv = Math.min(4, Math.floor(G.power)), fr = G.power - lv;
  txt('PWR', 12, H - 30, 8, 'rgba(255,255,255,.5)', 'left', 700, 1.5);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(42 + i * 17, H - 36, 14, 5);
    ctx.fillStyle = '#ff8fd1';
    if (i < lv) ctx.fillRect(42 + i * 17, H - 36, 14, 5); else if (i === lv && lv < 4) ctx.fillRect(42 + i * 17, H - 36, 14 * fr, 5);
  }
  txt('GRAZE ' + G.graze, 12, H - 16, 8, 'rgba(255,255,255,.5)', 'left', 700, 1.5);
  // bomb button
  const bx = W - 44, by = H - 48, ok = G.bombs > 0 && bombT <= 0 && P.alive;
  ctx.strokeStyle = ok ? 'rgba(125,255,176,.8)' : 'rgba(255,255,255,.2)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(bx, by, 25, 0, TAU); ctx.stroke();
  ctx.fillStyle = ok ? 'rgba(125,255,176,.08)' : 'rgba(0,0,0,0)'; ctx.fill();
  txt('BOMB', bx, by - 5, 7, ok ? '#7dffb0' : 'rgba(255,255,255,.3)', 'center', 700, 1.5);
  txt(G.bombs, bx, by + 11, 14, ok ? '#fff' : 'rgba(255,255,255,.3)', 'center', 900);
  uiBtns.push({ x: bx - 34, y: by - 34, w: 68, h: 68, fn: bomb });
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.t / 20); txt(t.s, t.x, t.y, 9, t.col, 'center', 900, 2); ctx.globalAlpha = 1; }
}
function band(y, h, a) { ctx.fillStyle = `rgba(4,5,10,${.6 * a})`; ctx.fillRect(0, y, W, h); }
function drawOverlays() {
  const st = STAGES[G.stage], a = st.col;
  // stage intro
  if (S.phase === 'waves' && S.t < 230 && mode !== 'over') {
    const t = S.t, al = Math.min(1, t / 25, (230 - t) / 30);
    ctx.globalAlpha = al;
    const lw = Math.min(1, t / 40) * 150;
    ctx.fillStyle = a; ctx.fillRect(W / 2 - lw, 238, lw * 2, 1); ctx.fillRect(W / 2 - lw, 318, lw * 2, 1);
    txt('STAGE 0' + (G.stage + 1), W / 2, 262, 11, a, 'center', 700, 6);
    txt(st.name, W / 2, 296, 34, '#fff', 'center', 900, 5);
    txt(st.sub, W / 2, 311, 9, 'rgba(255,255,255,.6)', 'center', 400, 4);
    ctx.globalAlpha = 1;
  }
  // warning
  if (S.phase === 'warn' || (S.phase === 'boss' && boss && boss.enter > 60)) {
    const t = S.phase === 'warn' ? S.pt : 150 + (150 - boss.enter);
    const al = Math.min(1, t / 15, (240 - t) / 30) * (.75 + .25 * Math.sin(t * .3));
    if (al > 0) {
      ctx.save(); ctx.globalAlpha = al;
      band(250, 80, 1);
      ctx.beginPath(); ctx.rect(0, 250, W, 10); ctx.rect(0, 320, W, 10); ctx.clip();
      ctx.fillStyle = '#ff3b4a';
      for (let x = -40 + (t * 1.5) % 20; x < W + 20; x += 20) { ctx.beginPath(); ctx.moveTo(x, 250); ctx.lineTo(x + 10, 250); ctx.lineTo(x + 20, 330); ctx.lineTo(x + 10, 330); ctx.fill(); }
      ctx.restore();
      ctx.globalAlpha = al;
      txt('WARNING', W / 2, 297, 30, '#ff3b4a', 'center', 900, 6);
      txt('APPROACHING : ' + BOSSES[st.boss].name, W / 2, 313, 8, '#fff', 'center', 700, 3);
      ctx.globalAlpha = 1;
    }
  }
  // phase banner
  if (boss && boss.banner > 0 && boss.enter <= 0 && !boss.dying) {
    const t = 150 - boss.banner, al = Math.min(1, t / 15, boss.banner / 25), off = (1 - Math.min(1, t / 20)) * 40;
    ctx.globalAlpha = al;
    ctx.fillStyle = boss.col; ctx.fillRect(W - 170 + off, 232, 170, 1);
    txt('PHASE ' + (boss.pi + 1) + ' / ' + boss.d.phases.length, W - 14 + off, 226, 8, boss.col, 'right', 700, 3);
    txt(boss.d.phases[boss.pi].name, W - 14 + off, 250, 13, '#fff', 'right', 900, 2);
    ctx.globalAlpha = 1;
  }
  // clear
  if (S.phase === 'clear' && S.pt > 40) {
    const t = S.pt - 40, al = Math.min(1, t / 20, (290 - t) / 30);
    ctx.globalAlpha = Math.max(0, al);
    band(220, 130, 1);
    ctx.fillStyle = a; ctx.fillRect(40, 222, W - 80, 1); ctx.fillRect(40, 348, W - 80, 1);
    txt(G.stage === 4 ? 'SOL DOWN' : 'STAGE CLEAR', W / 2, 262, 24, '#fff', 'center', 900, 4);
    txt('CLEAR BONUS', 60, 296, 9, 'rgba(255,255,255,.6)', 'left', 700, 2); txt(S.bonus.clear.toLocaleString('en-US'), W - 60, 296, 11, '#fff', 'right', 700, 1);
    txt('GRAZE BONUS', 60, 318, 9, 'rgba(255,255,255,.6)', 'left', 700, 2); txt(S.bonus.graze.toLocaleString('en-US'), W - 60, 318, 11, '#fff', 'right', 700, 1);
    ctx.globalAlpha = 1;
  }
  // bomb "cat burst"
  if (bombT > 0) {
    const f = 1 - bombT / 120;
    ctx.save(); ctx.globalAlpha = Math.max(0, .5 - f * .5); ctx.lineWidth = 2;
    cat(W / 2, H / 2, 60 + f * 260, null, '#ffffff', null);
    ctx.restore();
    if (bombT > 70) { ctx.globalAlpha = (bombT - 70) / 50; txt('CAT BURST', W / 2, H / 2 + 120, 14, '#7dffb0', 'center', 900, 6); ctx.globalAlpha = 1; }
  }
}
function dim(a) { ctx.fillStyle = `rgba(4,5,10,${a})`; ctx.fillRect(0, 0, W, H); }
function drawPause() {
  dim(.75);
  txt('PAUSE', W / 2, 250, 28, '#fff', 'center', 900, 8);
  btn('RESUME', W / 2 - 90, 290, 180, 40, resume, { stroke: acc() });
  btn('SOUND : ' + (AU.on ? 'ON' : 'OFF'), W / 2 - 90, 342, 180, 40, toggleSound);
  btn('TITLE', W / 2 - 90, 394, 180, 40, toTitle);
}
function drawOver() {
  dim(Math.min(.7, overT / 60));
  if (overT < 30) return;
  ctx.globalAlpha = Math.min(1, (overT - 30) / 30);
  txt('GAME OVER', W / 2, 240, 30, '#fff', 'center', 900, 6);
  txt('SCORE ' + fmt(G.score), W / 2, 266, 10, 'rgba(255,255,255,.6)', 'center', 700, 2);
  ctx.globalAlpha = 1;
  if (overT > 60) {
    btn('CONTINUE', W / 2 - 90, 300, 180, 42, doContinue, { stroke: acc() });
    btn('TITLE', W / 2 - 90, 354, 180, 42, toTitle);
    txt('コンティニューするとスコアは 0 から', W / 2, 420, 9, 'rgba(255,255,255,.45)', 'center', 400);
  }
}
function doContinue() {
  saveHi(); G.score = 0; G.cont++; G.lives = 2; G.bombs = 3; mode = 'game';
  P.alive = true; P.x = W / 2; P.y = H + 30; P.enter = 40; P.inv = 200;
  playBGM(G.stage, S.phase === 'boss');
}

// ---------- title ----------
const ORBIT = [['#ffc53a', 0, 0], ['#ff5a4a', 42, .018], ['#ff9a5c', 70, .011], ['#ffd27a', 100, .008], ['#4cc9ff', 132, .005]];
function drawTitle() {
  drawBG(0);
  const cx = W / 2, cy = 336;
  // orrery
  ctx.save();
  for (let i = 1; i < ORBIT.length; i++) {
    const [c, r, s] = ORBIT[i];
    ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(cx, cy, r, r * .36, 0, 0, TAU); ctx.stroke();
    const a = frame * s + i * 1.7; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r * .36, 3, 0, TAU); ctx.fill();
  }
  ctx.restore();
  drawShip(cx, cy + Math.sin(frame * .04) * 5 - 4, 3.2, frame, Math.sin(frame * .02) * .6);
  txt('SOLAR  SYSTEM  SHOOTING', cx, 78, 8, 'rgba(255,255,255,.5)', 'center', 700, 3);
  txt('NEKO', cx, 132, 50, '#ffffff', 'center', 900, 10);
  txt('DEBRIS', cx, 184, 50, '#ffffff', 'center', 900, 10);
  ctx.fillStyle = '#4cc9ff'; ctx.fillRect(cx - 110, 198, 220, 1.5);
  ctx.fillStyle = '#ffc53a'; ctx.fillRect(cx - 110, 202, 80, 1.5);
  txt('猫 デ ブ リ', cx, 222, 11, 'rgba(255,255,255,.75)', 'center', 700, 4);
  txt('PILOTS : SHIRO & KURO', cx, 420, 8, 'rgba(255,255,255,.45)', 'center', 700, 3);
  if ((frame >> 5) % 2 === 0) txt('TAP TO START', cx, 456, 13, '#fff', 'center', 700, 5);
  // stage select
  txt('STAGE SELECT', cx, 494, 8, 'rgba(255,255,255,.4)', 'center', 700, 3);
  for (let i = 0; i < 5; i++) {
    const x = 26 + i * 63, y = 504, ok = i <= unlocked, st = STAGES[i];
    ctx.strokeStyle = ok ? hexA(st.col, .8) : 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, 56, 42);
    ctx.fillStyle = ok ? st.col : 'rgba(255,255,255,.12)'; ctx.fillRect(x, y, 56, 2);
    txt('0' + (i + 1), x + 28, y + 22, 13, ok ? '#fff' : 'rgba(255,255,255,.2)', 'center', 900, 1);
    txt(ok ? st.name : '-----', x + 28, y + 36, 6.5, ok ? hexA(st.col, .9) : 'rgba(255,255,255,.2)', 'center', 700, 1);
    if (ok) uiBtns.push({ x, y, w: 56, h: 42, fn: () => { SFX.select(); newGame(i); } });
  }
  txt('ドラッグで移動 ・ ショットは自動 ・ BOMBで弾消し', cx, 576, 9, 'rgba(255,255,255,.55)', 'center', 400);
  txt('HI SCORE  ' + fmt(hi), cx, 606, 9, 'rgba(255,255,255,.45)', 'center', 700, 2);
  // sound toggle
  txt(AU.on ? 'SOUND ON' : 'SOUND OFF', W - 12, 24, 8, AU.on ? '#fff' : 'rgba(255,255,255,.35)', 'right', 700, 2);
  uiBtns.push({ x: W - 90, y: 0, w: 90, h: 40, fn: toggleSound });
}
function drawEnding() {
  drawBG(4);
  ctx.globalAlpha = Math.min(1, endT / 60);
  drawPlanet('sun', W / 2, H + 40, 150, frame);
  const y = 250 - Math.min(1, endT / 200) * 40;
  drawShip(W / 2, y + Math.sin(frame * .04) * 4, 2.6, frame, 0);
  txt('MISSION COMPLETE', W / 2, 90, 20, '#fff', 'center', 900, 4);
  ctx.fillStyle = '#ffc53a'; ctx.fillRect(W / 2 - 110, 104, 220, 1.5);
  if (endT > 60) {
    txt('SCORE', W / 2, 330, 8, 'rgba(255,255,255,.5)', 'center', 700, 3);
    txt(fmt(G.score), W / 2, 352, 20, '#fff', 'center', 900, 2);
    txt('GRAZE ' + G.graze + '   CONTINUE ' + G.cont, W / 2, 374, 9, 'rgba(255,255,255,.55)', 'center', 700, 2);
    txt('シロとクロは、太陽系のデブリを', W / 2, 414, 11, '#fff', 'center', 400);
    txt('すべて撃ち抜いた。', W / 2, 434, 11, '#fff', 'center', 400);
  }
  if (endT > 90 && (frame >> 5) % 2 === 0) txt('TAP TO TITLE', W / 2, 480, 11, '#fff', 'center', 700, 4);
  ctx.globalAlpha = 1;
}

function draw() {
  uiBtns = [];
  ctx.save();
  if (mode === 'title') { drawTitle(); ctx.restore(); return; }
  if (mode === 'ending') { drawEnding(); ctx.restore(); return; }
  drawBG(G.stage);
  if (shake) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  // distant planet
  if (S.phase === 'waves' || S.phase === 'warn') {
    const p = Math.min(1, S.t / S.waves.end), al = S.phase === 'warn' ? Math.max(0, .5 - S.pt / 150 * .5) : .5;
    ctx.globalAlpha = al; drawPlanet(STAGES[G.stage].boss, W * .72, 120 + p * 30, 6 + p * 26, frame); ctx.globalAlpha = 1;
  }
  drawItems();
  for (const e of ens) drawEnemy(e);
  if (boss) drawBoss(boss);
  drawShots();
  drawPlayer();
  drawParts();
  drawBullets();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(.8, flash)})`; ctx.fillRect(0, 0, W, H); }
  drawOverlays();
  drawHUD();
  if (mode === 'pause') { uiBtns = []; drawPause(); }
  if (mode === 'over') { uiBtns = []; drawOver(); }
}

// ============================================================
//  INPUT
// ============================================================
function pause() { if (mode !== 'game') return; mode = 'pause'; touch.id = null; if (AU.c) AU.c.suspend(); }
function resume() { mode = 'game'; if (AU.c) AU.c.resume(); resetTouch(); }
function toggleSound() { AU.on = !AU.on; store.set('nd_snd', AU.on); if (AU.m) AU.m.gain.value = AU.on ? .6 : 0; }
function lp(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const p = lp(e);
  for (let i = uiBtns.length - 1; i >= 0; i--) { const b = uiBtns[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; } }
  if (mode === 'title') { SFX.select(); newGame(0); return; }
  if (mode === 'ending') { if (endT > 90) toTitle(); return; }
  if (mode === 'game' && touch.id === null) {
    touch.id = e.pointerId; touch.sx = touch.cx = p.x; touch.sy = touch.cy = p.y; touch.px = P.x; touch.py = P.y;
    try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  }
}, { passive: false });
cv.addEventListener('pointermove', e => { if (e.pointerId !== touch.id) return; const p = lp(e); touch.cx = p.x; touch.cy = p.y; });
const pup = e => { if (e.pointerId === touch.id) touch.id = null; };
cv.addEventListener('pointerup', pup); cv.addEventListener('pointercancel', pup);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
addEventListener('keydown', e => {
  keys[e.key] = true; audioInit();
  const k = e.key;
  if (mode === 'title' && (k === 'Enter' || k === ' ' || k === 'z')) newGame(0);
  else if (mode === 'game') { if (k === 'x' || k === 'X') bomb(); if (k === 'Escape' || k === 'p') pause(); }
  else if (mode === 'pause' && (k === 'Escape' || k === 'p')) resume();
  else if (mode === 'ending' && endT > 90 && (k === 'Enter' || k === ' ')) toTitle();
  if (k.startsWith('Arrow') || k === ' ') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ============================================================
//  LOOP
// ============================================================
let last = 0, accT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(100, last ? ts - last : 16.7); last = ts; accT += dt;
  let n = 0; while (accT >= 1000 / 60 && n < 4) { update(); accT -= 1000 / 60; n++; }
  if (n === 4) accT = 0;
  draw();
}
requestAnimationFrame(loop);
</script>
